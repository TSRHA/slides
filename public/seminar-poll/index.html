<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSRHA 現場互動問卷｜三葉唇魚</title>
    <style>
      :root {
        color-scheme: dark;
        --sea: #061826;
        --sea-2: #092438;
        --accent: #58c2b0;
        --ink: #f7fbff;
        --muted: rgba(247, 251, 255, 0.68);
        --line: rgba(180, 225, 226, 0.22);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        background: radial-gradient(circle at 15% 0%, rgba(88, 194, 176, 0.18), transparent 34%), var(--sea);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 22px 18px 34px;
      }

      img {
        width: 100%;
        height: auto;
        max-height: 42svh;
        object-fit: cover;
        object-position: 48% center;
        border: 1px solid var(--line);
      }

      .kicker {
        margin-top: 20px;
        color: var(--accent);
        letter-spacing: 0.18em;
        font-size: 13px;
      }

      h1 {
        margin: 8px 0 10px;
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1.12;
      }

      p {
        color: var(--muted);
        line-height: 1.7;
      }

      .question {
        margin: 18px 0 12px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 700;
      }

      .choice {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        width: 100%;
        margin: 10px 0;
        padding: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.045);
        color: var(--ink);
        text-align: left;
        font: inherit;
      }

      .choice:disabled {
        opacity: 0.62;
      }

      .choice strong {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(88, 194, 176, 0.7);
        color: var(--accent);
      }

      .choice span {
        line-height: 1.65;
        font-size: 17px;
      }

      .status {
        min-height: 30px;
        margin-top: 14px;
        color: var(--accent);
        line-height: 1.6;
      }

      .note {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: rgba(247, 251, 255, 0.56);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../images/trilobed-wrasse.png" alt="三葉唇魚在礁區海水中游動" />
      <div class="kicker">TSRHA 現場互動問卷</div>
      <h1>我是「三葉唇魚」</h1>
      <p>我是台灣東北角海岸近礁常見魚類。</p>
      <div class="question">請問我是：</div>

      <button class="choice" data-answer="fast" type="button">
        <strong>1</strong>
        <span>游速快、好奇心強。常常成群結隊。</span>
      </button>
      <button class="choice" data-answer="cautious" type="button">
        <strong>2</strong>
        <span>警戒心強，游速慢，鬼鬼祟祟。獨立行徑。</span>
      </button>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p class="note">本問卷只送出匿名選項代碼到即時訊息通道，供現場簡報頁面當下統計；此頁不要求登入、不收集姓名。</p>
    </main>

    <script>
      const params = new URLSearchParams(location.search)
      const topic = params.get('topic') || 'tsrha-seminar-trilobed-wrasse-20260814'
      const poll = 'trilobed-wrasse'
      const statusEl = document.querySelector('#status')
      const storageKey = `tsrha:${poll}:clientId`
      const voteKey = `tsrha:${poll}:answer:${topic}`
      const labels = {
        fast: '選項 1',
        cautious: '選項 2',
      }

      let clientId = localStorage.getItem(storageKey)
      if (!clientId) {
        clientId = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`
        localStorage.setItem(storageKey, clientId)
      }

      const previous = localStorage.getItem(voteKey)
      if (previous) {
        statusEl.textContent = `你已送出${labels[previous] || '答案'}。重新點選可更改答案。`
      }

      async function submit(answer) {
        const payload = {
          poll,
          answer,
          clientId,
          sentAt: new Date().toISOString(),
        }
        statusEl.textContent = '送出中…'
        document.querySelectorAll('.choice').forEach((button) => { button.disabled = true })
        try {
          const response = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          })
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          localStorage.setItem(voteKey, answer)
          statusEl.textContent = `已送出${labels[answer]}，螢幕統計會即時更新。你也可以重新點選更改答案。`
        } catch (error) {
          statusEl.textContent = '送出失敗，請確認手機網路後再試一次。'
        } finally {
          document.querySelectorAll('.choice').forEach((button) => { button.disabled = false })
        }
      }

      document.querySelectorAll('.choice').forEach((button) => {
        button.addEventListener('click', () => submit(button.dataset.answer))
      })
    </script>
  </body>
</html>
